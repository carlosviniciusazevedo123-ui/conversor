<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversor de moeda</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div id="container">

        <img src="./img/sifrão.gif" id="gif" alt="Gif dinheiro">

        <main id="corpo">

            <label for="primeiroseletor" id="primeiro">Converter <b>de:</b></label>
            <select id="primeiroseletor">
                <option value="real">R$ Real brasileiro</option>

            </select>


            <label for="segundoseletor" id="segundo">Converter</label>
            <select id="segundoseletor">
                <option value="dolar">US$ Dólar americano</option>
                <option value="euro">€ Euro europeu</option>
                <option value="bitcoin">BTC Bitcoin</option>
            </select>

            <p id="terceiro"><strong>Valor</strong></p>

            <input type="number" id="valor" placeholder="Digite o valor">

            <button type="button" id="botao-converter">
                Converter
            </button>

            <div id="resultado">

                <div id="moeda1" class="moeda">
                    <img id="primeiraimg" src="./img/brasil.png" alt="moeda a converter">
                    <p id="primeiramoeda">Real</p>
                    <p id="primeirovalor"> 0,00</p>
                </div>

                <img src="/img/seta-baixo.gif" id="vetor" alt="Seta de conversão">

                <div id="moeda2" class="moeda">
                    <img id="segundaimg" src="./img/dolar.png" alt="moeda convertida">
                    <p id="segundamoeda">Dólar</p>
                    <p id="segundovalor"> 0,00</p>
                </div>

            </div>

        </main>

    </div>

    <script src="scripts.js"></script>

</body>

</html>
